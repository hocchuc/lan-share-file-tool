name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-lint-and-syntax:
    name: Validate Python Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python Syntax & Compilation
        run: |
          python -m py_compile server.py port_scanner.py
          echo "Python syntax check passed."

      - name: Smoke Test Server CLI Flags
        run: |
          python server.py --help || true
          python port_scanner.py --help

  docker-build:
    name: Build & Verify Docker Container
    runs-on: ubuntu-latest
    needs: python-lint-and-syntax
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t lan-file-share:test .

      - name: Verify Container Health & Endpoints
        run: |
          docker run -d -p 8080:8080 --name test-server lan-file-share:test
          sleep 4
          # Test HTTP endpoint
          curl --fail -s http://127.0.0.1:8080/api/files
          echo -e "\nDocker container healthcheck verified successfully."
          docker stop test-server
